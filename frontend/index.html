<!DOCTYPE html>
<!-- data-product scopes the Datalytics token layer; data-theme selects light
     (the product default). Both live on <html> because the dark palette
     selects on the two together. -->
<html lang="en" dir="ltr" data-product="datalytics" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="description" content="Datalytics — connect data, ask in plain language, build dashboards." />
    <title>Datalytics</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entries/app.tsx"></script>
  </body>
</html>
