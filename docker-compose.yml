# Datalytics: database + API + web app.
#
#   cp .env.example .env      # once; then fill in the three required values
#   docker compose up --build # build and start
#   docker compose down       # stop (data is kept in the "postgres_data" volume)
#
# Then open http://localhost:3002 and sign in with ADMIN_EMAIL / ADMIN_PASSWORD.
#
# Only the web app is published on the host. The API is reached through it at
# /api, and the database is not reachable from outside Docker at all.
services:
  postgres:
    image: postgres:16-alpine   # already on the dev machines; same version the tests ran on
    restart: unless-stopped
    environment:
      POSTGRES_DB: datalytics
      POSTGRES_USER: datalytics
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datalytics -d datalytics"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    image: datalytics-optimized-backend:dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENV: production
      DATABASE_URL: postgresql+asyncpg://datalytics:${POSTGRES_PASSWORD}@postgres:5432/datalytics
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
    image: datalytics-optimized-frontend:dev
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3002}:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
